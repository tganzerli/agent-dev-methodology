description = "Propagate a completed execution log into the wiki knowledge pages"

prompt = """
You are executing the `/wiki-sync` command in this project.

The canonical source of truth is `@.claude/skills/wiki-sync/SKILL.md` and `@.agents/METHODOLOGY.md` §4.5.
Follow the steps:
1. Locate and validate execution log in `{{project}}_wiki/work/executions/{{args}}.md` (must be `status: done`).
2. Update/create knowledge pages using surgical edits and file:line citations.
3. Update indices (`_meta/index.md`, `/wiki-index <dir>` for generated catalogs, and regenerate the work index via `/work-index`).
4. Run the mechanical close-out script — it updates `related[]` in the execution log, appends the entry to `{{project}}_wiki/_meta/log.md`, marks the plan `executed` and checks the catalogs:
   `python3 .claude/skills/wiki-sync/sync_bookkeeping.py {{args}} --page '<path>|<CREATE|UPDATE|APPEND>|<note>' ...`
   Never read or edit `_meta/log.md` yourself.
5. Human gate to review diff.

Arguments: {{args}}
"""
